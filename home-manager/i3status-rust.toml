[theme]
theme = "native"

[[block]]
block = "cpu"
interval = 2
format = " CPU: $utilization "

[[block]]
block = "temperature"
format = " $icon: $max "
interval = 2

[[block]]
block = "memory"
format = " RAM: $mem_used.eng(w:4) "
interval = 2
 
[[block]]
block = "sound"
format = " VOL: {$volume|mute} "

[[block]]
block = "time"
format = "$timestamp.datetime(f:'%a %d/%m %R') "
interval = 1
[block.theme_overrides]
idle_fg = "#dbb35c" 

[[block]]
block = "custom"
command = "echo wal"
format = "  "
[[block.click]]
button = "left"
cmd = "~/.config/rofi/scripts/wallpaper.sh"

[[block]]
block = "custom"
command = "echo power"
format = "  "
[[block.click]]
button = "left"
cmd = "bash -c ~/.config/rofi/scripts/powermenu.sh"
