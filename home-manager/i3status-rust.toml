[theme]
theme = "native"

[[block]]
block = "cpu"
interval = 2
format = " CPU: $utilization "
[block.theme_overrides]
idle_fg = "#a6e3a1"
good_fg = "#a6e3a1" 
info_fg = "#a6e3a1" 
warning_fg = "#f9e2af"
critical_cpu = "#ff0048"

[[block]]
block = "temperature"
format = " $icon: $max "
interval = 2
[block.theme_overrides]
idle_fg = "#f38ba8" 
good_fg = "#f38ba8" 
info_fg = "#f38ba8" 
warning_fg = "#ff0048"

[[block]]
block = "memory"
format = " RAM: $mem_used.eng(w:4) "
interval = 2
[block.theme_overrides]
idle_fg = "#94e2d5" 

[[block]]
block = "sound"
format = " VOL: {$volume|mute} "
[block.theme_overrides]
idle_fg = "#f9e2af" 

[[block]]
block = "time"
format = "$timestamp.datetime(f:'%a %d/%m %R') "
interval = 1
[block.theme_overrides]
idle_fg = "#dbb35c" 

[[block]]
block = "custom"
command = "echo wal"
format = "  "
[[block.click]]
button = "left"
cmd = "~/.config/rofi/scripts/wallpaper.sh"


[[block]]
block = "custom"
command = "echo power"
format = "  "
[[block.click]]
button = "left"
cmd = "bash -c ~/.config/rofi/scripts/powermenu.sh"
[block.theme_overrides]
idle_fg = "#ff0048" 
