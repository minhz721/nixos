
[colors]
background = #282828
background-alt = #3c3836
foreground = #a89984
primary = #fabd2f
alert = #fb4934
disabled = #665c54
white = #ebdbb2


[bar/main]
width = 100%
height = 32
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

font-0 = JetBrainsMono Nerd Font:size=14;2

modules-left = i3
modules-center = datetime
modules-right = cpu temperature memory pulseaudio wallpaper power

padding-left = 1
padding-right = 1

module-margin-left = 0
module-margin-right = 1

tray-position = right
tray-padding = 1

enable-ipc = true


wm-restack = i3
override-redirect = false

cursor-click = pointer
cursor-scroll = ns-resize


